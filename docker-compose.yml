name: rinha-2026-italo-cpu

# Variant cpu v7: C=2048 IVF-F32 + Adaptive NPROBE=8 fast + NPROBE_DEEP=20.
# 4× more centroids than canonical (2048 vs 512) → each cluster ~1465 vecs
# (vs 5859). Fast pass: 8 × 1465 = ~12k vec scan (vs canonical 5 × 5859 = 29k).
# Middle ground between canonical C=512 and np5 C=4096.
# Centroid scan: 2048 × 14 × 4 = 112KB (fits L2; canonical 28KB fits L1).
# Image: italovinicius18/rinha-2026-data-prep:v8-c2048 (C=2048 F32 index).
# Total budget: haproxy 0.15 + data-prep 0.05 + 2×api 0.40 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v8-c2048
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "8"
      NPROBE_DEEP: "20"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "8"
      NPROBE_DEEP: "20"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
