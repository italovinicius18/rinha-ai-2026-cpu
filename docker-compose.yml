name: rinha-2026-italo-cpu

# Variant cpu v6: PQ-rerank smaller config — NPROBE=8, RERANK_N=100.
# Faster than np5's np=12 N=200 but accuracy is borderline (1 FP + 2 FN local
# at np=8 N=50; should be 0/1 at N=100). Tests if a smaller PQ search wins on
# Mac Mini by maximizing CPU savings even at slight accuracy cost.
# Image: italovinicius18/rinha-2026-api:v5-pq-rerank.
# Total budget: haproxy 0.15 + data-prep 0.05 + 2×api 0.40 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v5-pq-rerank
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v5-pq-rerank
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "8"
      RERANK_N: "100"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v5-pq-rerank
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "8"
      RERANK_N: "100"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
