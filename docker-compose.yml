name: rinha-2026-italo-cpu

# Variant cpu v8: canonical C=512 Adaptive 5→10 with GOGC=off + GOMEMLIMIT=130MiB.
# Same binary as canonical (v2-adaptive). Only the Go runtime memory policy
# changes: no periodic heap-growth GC; GC only triggers if RSS approaches limit.
# Hypothesis: removes periodic GC pauses → lower p99 tail jitter.
# Local WSL 4-way bench: +5666 p99 1.42ms (vs canonical +5619 p99 1.59ms) = +47 / -0.17ms.
# Total budget: haproxy 0.15 + data-prep 0.05 + 2×api 0.40 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v1
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "off"
      GOMEMLIMIT: "130MiB"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v2-adaptive
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      NPROBE_DEEP: "10"
      GOMAXPROCS: "1"
      GOGC: "off"
      GOMEMLIMIT: "130MiB"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
